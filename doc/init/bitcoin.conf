# Bitcoin Core configuration for heirdrop, /etc/bitcoin/bitcoin.conf
# Owned by bitcoin:bitcoin, mode 0640. See doc/1-bitcoin-node.md.
# heirdrop needs only RPC: neither txindex nor a wallet.

server=1
# cookie readable by the bitcoin group (Bitcoin Core 27+); the heirdrop unit
# joins that group to read it
rpccookieperms=group

# rehearsal only, remove for mainnet:
regtest=1
fallbackfee=0.0001

# mainnet options worth having:
# prune=10000
# disablewallet=1
