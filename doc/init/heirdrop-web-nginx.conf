# nginx in front of the heirdrop web app: TLS, buffering, limits.
# Install (Debian 12, as root): see doc/6-go-live.md, "TLS with nginx and
# Let's Encrypt". The certificate must exist before nginx -t; replace
# web.example.org (4 places) with your neutral host name.
#
# The host name ends up in public certificate logs: keep it neutral (no
# "bitcoin", "inheritance", family names).

limit_req_zone $binary_remote_addr zone=heirdropweb:1m rate=2r/s;

# Anything that does not name our host (IP scans, other names) gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name web.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.example.org;

    ssl_certificate     /etc/letsencrypt/live/web.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 60s;
    limit_req zone=heirdropweb burst=20 nodelay;

    access_log off;   # the web app logs what matters to the journal

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.0;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_max_temp_file_size 32m;
    }
}
